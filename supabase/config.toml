# TuitionOS — Local Supabase Development Configuration (Stage A2.1 Foundation)
# Used exclusively for local PostgreSQL / Supabase CLI development and automated testing.
# Never put production credentials or service-role keys in this file.

project_id = "tuitionos-local-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
# Short 15-minute access token TTL paired with authoritative DB membership RLS checks
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
enabled = true
file_size_limit = "25MiB"
